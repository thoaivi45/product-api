name: Product API - CRUD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      API_BASE_URL: http://127.0.0.1:3001

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run basic tests
        run: npm test

      - name: Validate Compose configuration
        run: docker compose -p product-ci -f docker-compose-ci.yaml config --quiet

      - name: Build and wait for healthy services
        run: docker compose -p product-ci -f docker-compose-ci.yaml up -d --build --wait --wait-timeout 120

      - name: Show container health
        run: docker compose -p product-ci -f docker-compose-ci.yaml ps

      - name: Run CRUD integration tests
        run: npm run test:integration

      - name: Login to Docker Hub
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Tag and push tested image
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="$DOCKERHUB_USERNAME/product-api"

          docker tag product-api:ci "$IMAGE:$GITHUB_SHA"
          docker tag product-api:ci "$IMAGE:latest"

          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Logout from Docker Hub
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker logout

      - name: Show logs on failure
        if: failure()
        run: docker compose -p product-ci -f docker-compose-ci.yaml logs --no-color --tail=100

      - name: Clean up test environment
        if: always()
        run: docker compose -p product-ci -f docker-compose-ci.yaml down -v

  deploy-local:
    name: Deploy to local Docker Engine
    needs: integration-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64, product-api-local]
    timeout-minutes: 10

    concurrency:
      group: product-api-local-deployment
      cancel-in-progress: false

    env:
      IMAGE_TAG: ${{ github.sha }}

    defaults:
      run:
        shell: powershell
        working-directory: 'D:\LT Hướng Dịch Vụ\IUH-MSA\product-api'

    steps:
      - name: Check local Docker and configuration
        run: |
          docker info | Out-Null
          docker compose -p product-api -f docker-compose-prod.yaml config --quiet

      - name: Pull tested image from Docker Hub
        run: |
          docker compose -p product-api -f docker-compose-prod.yaml pull product-api

      - name: Deploy and wait for healthchecks
        run: |
          docker compose -p product-api -f docker-compose-prod.yaml up -d --no-build --wait --wait-timeout 120

      - name: Verify deployed image and API
        run: |
          $expected = "thoaivi/product-api:$env:IMAGE_TAG"
          $actual = (docker inspect product-api --format '{{.Config.Image}}').Trim()

          if ($actual -ne $expected) {
              throw "Deployed image ($actual) does not match expected ($expected)"
          }

          $health = Invoke-RestMethod -Uri "http://localhost:3000/health" -TimeoutSec 10

          if ($health.status -ne "healthy" -or $health.database -ne "connected") {
              throw "API or database is unhealthy"
          }

          Write-Output "Deployed image: $actual"
          $health | ConvertTo-Json

          docker compose -p product-api -f docker-compose-prod.yaml ps

      - name: Show deployment logs on failure
        if: failure()
        run: docker compose -p product-api -f docker-compose-prod.yaml logs --tail=100