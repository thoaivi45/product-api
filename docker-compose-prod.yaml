services:
  mongodb:
    image: mongo:7
    container_name: tvimongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  product-api:
    image: thoaivi/product-api:${IMAGE_TAG:-latest}
    container_name: product-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      MONGO_URI: mongodb://mongodb:27017/productdb
      NODE_ENV: production
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health', { signal: AbortSignal.timeout(3000) }).then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mongodb_data:
    external: true
    name: tvimongodb_data